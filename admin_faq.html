<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FON - 관리자 FAQ 관리</title>

  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont,
        sans-serif;
      background-color: #ffffff;
      color: #111;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul { list-style: none; }

    /* ---------- 상단 네비게이션 (admin_inquiry와 동일) ---------- */
    .gnb-wrapper {
      width: 100%;
      background-color: #000;
      color: #fff;
    }

    .gnb {
      max-width: 1200px;
      margin: 0 auto;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gnb-logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .gnb-menu {
      display: flex;
      gap: 30px;
      font-size: 14px;
    }

    .gnb-menu a { color: #fff; }

    .gnb-menu a.sale {
      color: #ff3b3b;
      font-weight: 600;
    }

    .gnb-icons {
      display: flex;
      gap: 10px;
      align-items: center;
      color: #fff;
    }

    .icon-button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .icon-button svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 1.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-button:hover svg { opacity: 0.85; }

    /* ---------- 검색 오버레이 (공통) ---------- */
    .search-dim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease-out;
      z-index: 40;
    }
    .search-dim.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    .search-layer {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 110px;
      pointer-events: none;
      z-index: 50;
    }
    .search-layer.is-active {
      pointer-events: none;
    }

    .search-box {
      width: min(520px, 92vw);
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      padding: 18px 18px 14px;
      transform: translateY(-18px);
      opacity: 0;
      transition: transform 0.22s ease-out, opacity 0.22s ease-out;
      pointer-events: auto;
    }

    .search-layer.is-active .search-box {
      transform: translateY(0);
      opacity: 1;
    }

    .search-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-input {
      flex: 1;
      height: 38px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: #111;
    }

    .search-close-btn {
      background: none;
      border: none;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 999px;
    }

    .search-close-btn svg {
      width: 18px;
      height: 18px;
      stroke: #333;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
    }

    .search-close-btn:hover {
      background-color: #f4f4f4;
    }

    .search-results {
      margin-top: 6px;
      padding: 10px 8px 6px;
      border-radius: 6px;
      background-color: #fafafa;
    }

    .search-help {
      font-size: 12px;
      color: #888;
    }

    .search-no-result {
      display: none;
      margin-top: 6px;
      font-size: 13px;
      color: #777;
    }

    /* ---------- 상단 검정 배경 + 브레드크럼 ---------- */
    .admin-top-bar {
      background-color: #000;
      color: #fff;
      padding: 18px 0 22px;
    }

    .admin-top-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      font-size: 14px;
    }

    .admin-breadcrumb {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .admin-back-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      cursor: pointer;
      opacity: 0.8;
    }

    .admin-back-row span.icon {
      font-size: 16px;
    }

    .admin-title-main {
      font-size: 16px;
      font-weight: 600;
    }

    .admin-title-sub {
      font-size: 13px;
      color: #e5e7eb;
      opacity: 0.9;
    }

    /* ---------- 메인 영역 ---------- */
    .admin-faq-main {
      background-color: #f5f6f8;
      min-height: calc(100vh - 60px - 140px);
      padding: 32px 0 40px;
    }

    .admin-faq-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .faq-card {
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(15,23,42,0.06);
      padding: 22px 24px 24px;
      margin-bottom: 20px;
    }

    .faq-card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .form-row {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }

    .form-label span.required {
      color: #ef4444;
      margin-left: 2px;
    }

    .select-input,
    .text-input,
    .textarea-input {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
    }

    .select-input:focus,
    .text-input:focus,
    .textarea-input:focus {
      border-color: #111;
    }

    .select-input {
      height: 40px;
      background-color: #fff;
    }

    .textarea-input {
      min-height: 160px;
      resize: vertical;
    }

    .btn-submit {
      margin-top: 8px;
      width: 100%;
      height: 42px;
      border-radius: 8px;
      border: none;
      background-color: #000;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    /* ---------- FAQ 리스트 카드 ---------- */
    .faq-list-header {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .faq-empty {
      font-size: 14px;
      color: #6b7280;
      text-align: center;
      padding: 40px 0 30px;
    }

    .faq-item-card {
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      padding: 14px 16px 12px;
      margin-bottom: 10px;
      background-color: #f9fafb;
    }

    .faq-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
      color: #6b7280;
    }

    .faq-category-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background-color: #eef2ff;
      color: #4338ca;
    }

    .faq-date {
      font-size: 12px;
      color: #9ca3af;
    }

    .faq-q {
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      margin-bottom: 4px;
      white-space: pre-wrap;
    }

    .faq-a {
      font-size: 13px;
      color: #4b5563;
      white-space: pre-wrap;
      margin-bottom: 8px;
    }

    .faq-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .btn-sm-secondary {
      min-width: 70px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background-color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-sm-secondary:hover {
      background-color: #f3f4f6;
    }

    @media (max-width: 640px) {
      .admin-top-inner,
      .admin-faq-inner,
      .site-footer-inner {
        padding: 0 16px;
      }
      .faq-card {
        padding: 18px 16px 20px;
      }
    }

    /* ---------- FOOTER (공통) ---------- */
    .site-footer {
      background-color: #000;
      color: #fff;
      padding: 40px 0 20px;
      font-size: 14px;
      margin-top: 40px;
    }

    .site-footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .footer-columns {
      display: flex;
      flex-wrap: wrap;
      gap: 60px;
      margin-bottom: 30px;
      justify-content: space-between;
    }

    .footer-col-title {
      font-weight: 600;
      margin-bottom: 14px;
    }

    .footer-col ul { padding: 0; }

    .footer-col li + li { margin-top: 6px; }

    .footer-col a {
      color: #ddd;
      font-size: 13px;
    }

    .footer-col a:hover { color: #fff; }

    .footer-desc {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
    }

    .footer-sns {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 18px;
    }

    .footer-bottom {
      border-top: 1px solid #333;
      padding-top: 15px;
      font-size: 12px;
      color: #aaa;
      text-align: left;
    }
  </style>
</head>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      /* ---------------- 공통: 로그인, 관리자 플래그 ---------------- */
      const userLink = document.getElementById('userIconLink');
      if (userLink) {
        const isLoggedIn = localStorage.getItem('fonLoggedIn') === 'true';
        userLink.href = isLoggedIn ? 'mypage.html' : 'login.html';
      }
      if (localStorage.getItem('isAdmin') === 'true') {
        document
          .querySelectorAll('.admin-add')
          .forEach((el) => (el.style.display = 'flex'));
      }

      /* ---------------- 검색 레이어 ---------------- */
      const openBtn = document.getElementById('searchOpenBtn');
      const dim = document.getElementById('searchDim');
      const layer = document.getElementById('searchLayer');
      const input = document.getElementById('searchInput');
      const closeBtn = document.getElementById('searchCloseBtn');
      const noResult = document.getElementById('searchNoResult');
      const helpText = document.getElementById('searchHelp');

      function openSearch() {
        if (!dim || !layer) return;
        dim.classList.add('is-active');
        layer.classList.add('is-active');
        if (input) input.value = '';
        if (noResult) noResult.style.display = 'none';
        if (helpText) helpText.style.display = 'block';
        setTimeout(() => {
          if (input) input.focus();
        }, 10);
      }

      function closeSearch() {
        if (!dim || !layer) return;
        dim.classList.remove('is-active');
        layer.classList.remove('is-active');
      }

      if (openBtn) openBtn.addEventListener('click', openSearch);
      if (closeBtn) closeBtn.addEventListener('click', closeSearch);
      if (dim) dim.addEventListener('click', closeSearch);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeSearch();
      });

      if (input && noResult) {
        input.addEventListener('input', function (e) {
          const value = e.target.value.trim();
          if (!value) {
            noResult.style.display = 'none';
            if (helpText) helpText.style.display = 'block';
            return;
          }
          if (helpText) helpText.style.display = 'none';
          noResult.style.display = 'block';
        });
      }

      /* ---------------- FAQ 데이터 ---------------- */
      function loadFaqs() {
        const raw = localStorage.getItem('fonFaqs');
        if (!raw) return [];
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          console.error(e);
          return [];
        }
      }

      function saveFaqs(list) {
        localStorage.setItem('fonFaqs', JSON.stringify(list));
      }

      let faqs = loadFaqs();

      const categoryEl = document.getElementById('faqCategory');
      const questionEl = document.getElementById('faqQuestion');
      const answerEl = document.getElementById('faqAnswer');
      const submitBtn = document.getElementById('btnFaqSubmit');
      const listHeader = document.getElementById('faqListHeader');
      const listContainer = document.getElementById('faqListContainer');

      function formatDate(d = new Date()) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}. ${m}. ${day}.`;
      }

      function renderFaqList() {
        listHeader.textContent = `등록된 FAQ (${faqs.length}개)`;

        if (!faqs.length) {
          listContainer.innerHTML =
            '<p class="faq-empty">등록된 FAQ가 없습니다.</p>';
          return;
        }

        const html = faqs
          .map(
            (faq) => `
          <article class="faq-item-card">
            <div class="faq-item-top">
              <span class="faq-category-pill">${faq.category}</span>
              <span class="faq-date">${faq.date || ''}</span>
            </div>
            <div class="faq-q">${faq.question || ''}</div>
            <div class="faq-a">${faq.answer || ''}</div>
            <div class="faq-actions">
              <button type="button"
                      class="btn-sm-secondary"
                      onclick="deleteFaq(${faq.id})">
                삭제
              </button>
            </div>
          </article>
        `,
          )
          .join('');

        listContainer.innerHTML = html;
      }

      // 삭제 함수는 window에 노출
      window.deleteFaq = function (id) {
        if (!confirm('해당 FAQ를 삭제하시겠습니까?')) return;
        faqs = faqs.filter((f) => f.id !== id);
        saveFaqs(faqs);
        renderFaqList();
      };

      submitBtn.addEventListener('click', () => {
        const category = categoryEl.value.trim();
        const question = questionEl.value.trim();
        const answer = answerEl.value.trim();

        if (!category || !question || !answer) {
          alert('카테고리, 질문, 답변을 모두 입력해주세요.');
          return;
        }

        const nextId =
          faqs.length === 0 ? 1 : Math.max(...faqs.map((f) => f.id)) + 1;

        const newFaq = {
          id: nextId,
          category,
          question,
          answer,
          date: formatDate(),
        };

        faqs.unshift(newFaq); // 최신순 위로
        saveFaqs(faqs);
        renderFaqList();

        // 입력창 초기화
        questionEl.value = '';
        answerEl.value = '';
        categoryEl.value = '배송';

        alert('FAQ가 등록되었습니다.');
      });

      // 초기 렌더
      renderFaqList();
    });
  </script>
</body>
</html>
