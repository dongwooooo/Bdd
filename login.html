<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FON - 로그인</title>

  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont,
        sans-serif;
      background-color: #ffffff;
      color: #111;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ---------- 상단 네비게이션 (main과 동일) ---------- */
    .gnb-wrapper {
      width: 100%;
      background-color: #000;
      color: #fff;
    }

    .gnb {
      max-width: 1200px;
      margin: 0 auto;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gnb-logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .gnb-menu {
      display: flex;
      gap: 30px;
      font-size: 14px;
    }

    .gnb-menu a {
      color: #fff;
    }

    .gnb-menu a.sale {
      color: #ff3b3b;
      font-weight: 600;
    }

    .gnb-icons {
      display: flex;
      gap: 10px;
      align-items: center;
      color: #fff;
    }

    .icon-button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .icon-button svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 1.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-button:hover svg {
      opacity: 0.85;
    }

    /* ---------- 로그인 영역 ---------- */
    .auth-section {
      background-color: #f8fafc;
      min-height: calc(100vh - 60px - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .auth-card {
      width: 420px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      padding: 40px 50px 36px;
    }

    .auth-title {
      text-align: center;
      margin-bottom: 6px;
      font-size: 22px;
      font-weight: 700;
    }

    .auth-subtitle {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 44px;
      border-radius: 3px;
      border: 1px solid #ddd;
      padding: 0 12px;
      font-size: 14px;
    }

    .form-input::placeholder {
      color: #aaa;
    }

    .form-input:focus {
      outline: none;
      border-color: #000;
    }

    .login-btn {
      width: 100%;
      height: 46px;
      margin-top: 10px;
      border: none;
      background-color: #000;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .login-btn:hover {
      background-color: #222;
    }

    .auth-bottom {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #777;
    }

    .auth-bottom a {
      margin-left: 4px;
      font-weight: 600;
      text-decoration: underline;
    }

    /* ---------- 검색 오버레이 & 검색 박스 (공통) ---------- */
    .search-dim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease-out;
      z-index: 40;
    }

    .search-dim.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    .search-layer {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 110px;
      pointer-events: none;
      z-index: 50;
    }

    .search-layer.is-active {
      pointer-events: none;
    }

    .search-box {
      width: min(520px, 92vw);
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      padding: 18px 18px 14px;
      transform: translateY(-18px);
      opacity: 0;
      transition: transform 0.22s ease-out, opacity 0.22s ease-out;
      pointer-events: auto;
    }

    .search-layer.is-active .search-box {
      transform: translateY(0);
      opacity: 1;
    }

    .search-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-input {
      flex: 1;
      height: 38px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: #111;
    }

    .search-close-btn {
      background: none;
      border: none;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 999px;
    }

    .search-close-btn svg {
      width: 18px;
      height: 18px;
      stroke: #333;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
    }

    .search-close-btn:hover {
      background-color: #f4f4f4;
    }

    .search-results {
      margin-top: 6px;
      padding: 10px 8px 6px;
      border-radius: 6px;
      background-color: #fafafa;
    }

    .search-help {
      font-size: 12px;
      color: #888;
    }

    .search-no-result {
      display: none;
      margin-top: 6px;
      font-size: 13px;
      color: #777;
    }

    /* ---------- FOOTER ---------- */
    .site-footer {
      background-color: #000;
      color: #fff;
      padding: 40px 0 20px;
      font-size: 14px;
    }

    .site-footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .footer-columns {
      display: flex;
      flex-wrap: wrap;
      gap: 60px;
      margin-bottom: 30px;
      justify-content: space-between;
    }

    .footer-col-title {
      font-weight: 600;
      margin-bottom: 14px;
    }

    .footer-col ul {
      list-style: none;
      padding: 0;
    }

    .footer-col li + li {
      margin-top: 6px;
    }

    .footer-col a {
      color: #ddd;
      font-size: 13px;
    }

    .footer-col a:hover {
      color: #fff;
    }

    .footer-desc {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
    }

    .footer-sns {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 18px;
    }

    .footer-bottom {
      border-top: 1px solid #333;
      padding-top: 15px;
      font-size: 12px;
      color: #aaa;
      text-align: left;
    }

    @media (max-width: 768px) {
      .gnb {
        padding: 0 16px;
      }

      .gnb-menu {
        display: none;
      }

      .auth-card {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px 28px;
      }

      .footer-columns {
        flex-direction: column;
        gap: 24px;
      }

      .search-box {
        width: calc(100% - 32px);
      }
    }
  </style>
</head>
<body>
  <!-- 상단 네비게이션 -->
  <header class="gnb-wrapper">
    <nav class="gnb">
      <div class="gnb-logo">
        <a href="main.html">FON</a>
      </div>

      <div class="gnb-menu">
        <a href="main.html">Best</a>
        <a href="sale.html" class="sale">SALE</a>
        <a href="outer.html">아우터</a>
        <a href="top.html">상의</a>
        <a href="bottom.html">하의</a>
        <a href="accessory.html">악세사리</a>
        <a href="community.html">커뮤니티</a>
        <a href="#">코디하기</a>
      </div>

      <div class="gnb-icons">
        <!-- 검색 -->
        <button class="icon-button" aria-label="검색" id="searchOpenBtn">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="6.3"></circle>
            <line x1="15.4" y1="15.4" x2="20" y2="20"></line>
          </svg>
        </button>

        <!-- 로그인/마이페이지 -->
        <a href="login.html" class="icon-button" aria-label="로그인 / 마이페이지" id="userIconLink">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="9" r="3.1"></circle>
            <path d="M6.5 19c.8-2.6 2.8-4.3 5.5-4.3s4.7 1.7 5.5 4.3"></path>
          </svg>
        </a>

        <!-- 장바구니 -->
        <a href="cart.html" class="icon-button" aria-label="장바구니">
          <svg viewBox="0 0 24 24">
            <rect x="6.5" y="8" width="11" height="10" rx="1.8" ry="1.8"></rect>
            <path d="M9 8V6.7A2.2 2.2 0 0 1 12 4.5A2.2 2.2 0 0 1 15 6.7V8"></path>
            <path d="M9.3 12.2c.6.8 1.5 1.3 2.7 1.3s2.1-.5 2.7-1.3"></path>
          </svg>
        </a>

        <!-- 관리자 전용 플러스 -->
        <button
          class="icon-button admin-add"
          aria-label="관리자 대시보드"
          style="display: none"
          onclick="window.location.href='admin.html'">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="7.5"></circle>
            <line x1="12" y1="9" x2="12" y2="15"></line>
            <line x1="9" y1="12" x2="15" y2="12"></line>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- 검색 오버레이 -->
  <div class="search-dim" id="searchDim"></div>
  <div class="search-layer" id="searchLayer">
    <div class="search-box" role="dialog" aria-modal="true">
      <div class="search-header">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="원하는 상품, 게시글을 검색해보세요." />
        <button class="search-close-btn" id="searchCloseBtn" aria-label="검색 닫기">
          <svg viewBox="0 0 24 24">
            <line x1="8" y1="8" x2="16" y2="16"></line>
            <line x1="16" y1="8" x2="8" y2="16"></line>
          </svg>
        </button>
      </div>
      <div class="search-results">
        <p class="search-help" id="searchHelp">
          검색어를 입력하면 결과를 보여드릴게요.
        </p>
        <p class="search-no-result" id="searchNoResult">
          검색 결과가 없습니다.
        </p>
      </div>
    </div>
  </div>

  <!-- 로그인 영역 -->
  <section class="auth-section">
    <div class="auth-card">
      <h1 class="auth-title">로그인</h1>
      <p class="auth-subtitle">FON에 오신 것을 환영합니다</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="userId">아이디</label>
          <input
            id="userId"
            class="form-input"
            type="text"
            placeholder="아이디를 입력해주세요" />
        </div>

        <div class="form-group">
          <label class="form-label" for="userPw">비밀번호</label>
          <input
            id="userPw"
            class="form-input"
            type="password"
            placeholder="비밀번호를 입력해주세요" />
        </div>

        <button type="submit" class="login-btn">로그인</button>
      </form>

      <div class="auth-bottom">
        계정이 없으신가요?
        <a href="signup.html">회원가입</a>
      </div>
    </div>
  </section>

  <!-- 공통 푸터 -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="footer-columns">
        <div class="footer-col">
          <div class="footer-col-title">FON</div>
          <div class="footer-desc">
            트렌디한 패션을 제안하는<br />
            온라인 셀렉트샵
          </div>
        </div>

        <div class="footer-col">
          <div class="footer-col-title">고객센터</div>
          <ul>
            <li><a href="notice.html">공지사항</a></li>
            <li><a href="#">자주묻는질문</a></li>
            <li><a href="#">1:1 문의</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <div class="footer-col-title">정보</div>
          <ul>
            <li><a href="#">회사 소개</a></li>
            <li><a href="#">이용약관</a></li>
            <li><a href="#">개인정보처리방침</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <div class="footer-col-title">소셜 미디어</div>
          <div class="footer-sns">
            <a href="#">📷</a>
            <a href="#">📘</a>
            <a href="#">▶️</a>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        © 2024 FON. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- 로그인 / 공통 스크립트 -->
  <script>
    // ✅ 로그인 처리 (관리자 + 회원가입한 사용자 모두 처리)
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const id = document.getElementById('userId').value.trim();
      const pw = document.getElementById('userPw').value;

      // 회원가입 페이지에서 저장한 값 가져오기
      const savedId = localStorage.getItem('fonUserId');
      const savedPw = localStorage.getItem('fonUserPw');

      // 1) 관리자 계정
      if (id === 'admin' && pw === '1234!') {
        localStorage.setItem('isAdmin', 'true');
        localStorage.setItem('fonLoggedIn', 'true');
        alert('관리자 로그인 성공!');
        window.location.href = 'admin.html';
        return;
      }

      // 2) 일반 회원 (회원가입으로 저장된 계정)
      if (savedId && savedPw) {
        if (id === savedId && pw === savedPw) {
          localStorage.setItem('fonLoggedIn', 'true'); // ✅ 로그인 상태 저장
          alert('로그인 되었습니다.');
          window.location.href = 'main.html'; // 메인페이지로 이동
          return;
        } else {
          alert('아이디 또는 비밀번호가 올바르지 않습니다.');
          return;
        }
      }

      // 3) 저장된 계정 자체가 없을 때
      alert('회원가입된 계정이 없습니다. 먼저 회원가입을 해주세요.');
    });

    // 공통 초기화 (검색 + 사람 아이콘 + 관리자 플러스)
    document.addEventListener('DOMContentLoaded', function () {
      // 1) 관리자 플러스 아이콘 표시
      if (localStorage.getItem('isAdmin') === 'true') {
        document
          .querySelectorAll('.admin-add')
          .forEach((el) => (el.style.display = 'flex'));
      }

      // 2) 로그인 상태에 따라 사람 아이콘 목적지 변경
      const userLink = document.getElementById('userIconLink');
      if (userLink) {
        const isLoggedIn = localStorage.getItem('fonLoggedIn') === 'true';
        userLink.href = isLoggedIn ? 'mypage.html' : 'login.html';
      }

      // 3) 검색 레이어 공통 동작
      const openBtn = document.getElementById('searchOpenBtn');
      const dim = document.getElementById('searchDim');
      const layer = document.getElementById('searchLayer');
      const input = document.getElementById('searchInput');
      const closeBtn = document.getElementById('searchCloseBtn');
      const noResult = document.getElementById('searchNoResult');
      const helpText = document.getElementById('searchHelp');

      function openSearch() {
        if (!dim || !layer) return;
        dim.classList.add('is-active');
        layer.classList.add('is-active');
        if (input) {
          input.value = '';
        }
        if (noResult) noResult.style.display = 'none';
        if (helpText) helpText.style.display = 'block';
        setTimeout(() => {
          if (input) input.focus();
        }, 10);
      }

      function closeSearch() {
        if (!dim || !layer) return;
        dim.classList.remove('is-active');
        layer.classList.remove('is-active');
      }

      if (openBtn) {
        openBtn.addEventListener('click', openSearch);
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', closeSearch);
      }

      if (dim) {
        dim.addEventListener('click', closeSearch);
      }

      // ESC 키로 닫기
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeSearch();
        }
      });

      // 입력값 있을 때만 "검색 결과가 없습니다" 표시
      if (input && noResult) {
        input.addEventListener('input', function (e) {
          const value = e.target.value.trim();
          if (!value) {
            noResult.style.display = 'none';
            if (helpText) helpText.style.display = 'block';
            return;
          }
          if (helpText) helpText.style.display = 'none';
          noResult.style.display = 'block';
        });
      }
    });
  </script>
</body>
</html>
