<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FON - SALE</title>

  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont,
        sans-serif;
      background-color: #ffffff;
      color: #111;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ---------- 상단 네비게이션 ---------- */
    .gnb-wrapper {
      width: 100%;
      background-color: #000;
      color: #fff;
    }

    .gnb {
      max-width: 1200px;
      margin: 0 auto;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gnb-logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .gnb-menu {
      display: flex;
      gap: 30px;
      font-size: 14px;
    }

    .gnb-menu a {
      color: #fff;
      padding-bottom: 4px;
    }

    .gnb-menu a.sale {
      color: #ff3b3b;
      font-weight: 600;
    }

    /* 현재 페이지 표시용 흰색 밑줄 */
    .gnb-menu a.active {
      border-bottom: 2px solid #fff;
    }

    /* 우측 아이콘 영역 */
    .gnb-icons {
      display: flex;
      gap: 10px;
      align-items: center;
      color: #fff;
    }

    .icon-button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .icon-button svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 1.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-button:hover svg {
      opacity: 0.85;
    }

    /* ---------- 상단 SALE 배너 (검정 배경) ---------- */
    .sale-hero-bar {
      background-color: #000;
      color: #fff;
      padding: 70px 20px 80px;
      text-align: center;
    }

    .sale-hero-sub {
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 14px;
      color: #ff3b3b;
    }

    .sale-hero-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .sale-hero-desc {
      font-size: 14px;
      color: #ddd;
    }

    /* ---------- 본문 : 할인 상품 리스트 영역 ---------- */
    .sale-wrapper {
      max-width: 1200px;
      margin: 40px auto 120px;
      padding: 0 20px;
    }

    .sale-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .sale-header-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .sale-header-count {
      font-size: 13px;
      color: #666;
    }

    .sale-header-right {
      display: flex;
      align-items: center;
    }

    .select-sort {
      height: 34px;
      padding: 0 10px;
      border-radius: 3px;
      border: 1px solid #ddd;
      font-size: 13px;
      background-color: #fff;
    }

    /* 상품 그리드 */
    .sale-list-area {
      min-height: 260px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
    }

    .product-card {
      text-align: left;
      font-size: 13px;
    }

    .product-link {
      display: block;
    }

    .product-thumb {
      position: relative;
      width: 100%;
      padding-top: 130%;
      overflow: hidden;
      background-color: #f7f7f7;
      border-radius: 6px;
    }

    .product-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.25s ease-out, transform 0.25s ease-out;
    }

    .product-thumb img.hover-img {
      opacity: 0;
    }

    .product-card:hover .product-thumb img.hover-img {
      opacity: 1;
    }

    .product-card:hover .product-thumb img:first-child {
      transform: scale(1.03);
    }

    .product-info {
      margin-top: 8px;
    }

    .product-name {
      font-size: 13px;
      margin-bottom: 4px;
      color: #222;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-price {
      font-size: 13px;
      color: #333;
    }

    .sale-empty-box {
      width: 100%;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #777;
      text-align: center;
    }

    /* ---------- 검색 오버레이 & 검색 박스 (공통) ---------- */
    .search-dim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease-out;
      z-index: 40;
    }

    .search-dim.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    .search-layer {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 110px;
      pointer-events: none;
      z-index: 50;
    }

    .search-layer.is-active {
      pointer-events: none;
    }

    .search-box {
      width: min(520px, 92vw);
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      padding: 18px 18px 14px;
      transform: translateY(-18px);
      opacity: 0;
      transition: transform 0.22s ease-out, opacity 0.22s ease-out;
      pointer-events: auto;
    }

    .search-layer.is-active .search-box {
      transform: translateY(0);
      opacity: 1;
    }

    .search-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-input {
      flex: 1;
      height: 38px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: #111;
    }

    .search-close-btn {
      background: none;
      border: none;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 999px;
    }

    .search-close-btn svg {
      width: 18px;
      height: 18px;
      stroke: #333;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
    }

    .search-close-btn:hover {
      background-color: #f4f4f4;
    }

    .search-results {
      margin-top: 6px;
      padding: 10px 8px 6px;
      border-radius: 6px;
      background-color: #fafafa;
    }

    .search-help {
      font-size: 12px;
      color: #888;
    }

    .search-no-result {
      display: none;
      margin-top: 6px;
      font-size: 13px;
      color: #777;
    }

    /* ---------- FOOTER ---------- */
    .site-footer {
      background-color: #000;
      color: #fff;
      padding: 40px 0 20px;
      font-size: 14px;
    }

    .site-footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .footer-columns {
      display: flex;
      flex-wrap: wrap;
      gap: 60px;
      margin-bottom: 30px;
      justify-content: space-between;
    }

    .footer-col-title {
      font-weight: 600;
      margin-bottom: 14px;
    }

    .footer-col ul {
      list-style: none;
      padding: 0;
    }

    .footer-col li + li {
      margin-top: 6px;
    }

    .footer-col a {
      color: #ddd;
      font-size: 13px;
    }

    .footer-col a:hover {
      color: #fff;
    }

    .footer-desc {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
    }

    .footer-sns {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 18px;
    }

    .footer-bottom {
      border-top: 1px solid #333;
      padding-top: 15px;
      font-size: 12px;
      color: #aaa;
      text-align: left;
    }

    @media (max-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .gnb {
        padding: 0 16px;
      }

      .gnb-menu {
        display: none;
      }

      .sale-wrapper {
        padding: 0 16px;
      }

      .search-box {
        width: calc(100% - 32px);
      }

      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .sale-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- 검색 오버레이 -->

  <!-- 상단 SALE 배너 -->

  <!-- 할인 상품 리스트 영역 -->

  <!-- 공통 푸터 -->

 <script>
  // 할인 상품 불러오기 (localStorage: fonDiscountProducts)
  function loadDiscountProducts() {
    const raw = localStorage.getItem('fonDiscountProducts');
    if (!raw) return [];
    try {
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.error(e);
      return [];
    }
  }

  // 숫자만 뽑기
  function normalizePrice(value) {
    if (value == null) return null;
    const num = Number(String(value).replace(/[^0-9.-]/g, ''));
    return Number.isNaN(num) ? null : num;
  }

  function formatPrice(price) {
    const num = normalizePrice(price);
    if (num == null) return '';
    return num.toLocaleString('ko-KR') + '원';
  }

  document.addEventListener('DOMContentLoaded', function () {
    /* ---------- 로그인 / 관리자 플래그 ---------- */
    const userLink = document.getElementById('userIconLink');
    if (userLink) {
      const isLoggedIn = localStorage.getItem('fonLoggedIn') === 'true';
      userLink.href = isLoggedIn ? 'mypage.html' : 'login.html';
    }

    if (localStorage.getItem('isAdmin') === 'true') {
      document
        .querySelectorAll('.admin-add')
        .forEach((el) => (el.style.display = 'flex'));
    }

    /* ---------- 검색 레이어 ---------- */
    const openBtn = document.getElementById('searchOpenBtn');
    const dim = document.getElementById('searchDim');
    const layer = document.getElementById('searchLayer');
    const input = document.getElementById('searchInput');
    const closeBtn = document.getElementById('searchCloseBtn');
    const noResult = document.getElementById('searchNoResult');
    const helpText = document.getElementById('searchHelp');

    function openSearch() {
      if (!dim || !layer) return;
      dim.classList.add('is-active');
      layer.classList.add('is-active');
      if (input) input.value = '';
      if (noResult) noResult.style.display = 'none';
      if (helpText) helpText.style.display = 'block';
      setTimeout(() => {
        if (input) input.focus();
      }, 10);
    }

    function closeSearch() {
      if (!dim || !layer) return;
      dim.classList.remove('is-active');
      layer.classList.remove('is-active');
    }

    if (openBtn) openBtn.addEventListener('click', openSearch);
    if (closeBtn) closeBtn.addEventListener('click', closeSearch);
    if (dim) dim.addEventListener('click', closeSearch);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSearch();
    });

    if (input && noResult) {
      input.addEventListener('input', function (e) {
        const value = e.target.value.trim();
        if (!value) {
          noResult.style.display = 'none';
          if (helpText) helpText.style.display = 'block';
          return;
        }
        if (helpText) helpText.style.display = 'none';
        noResult.style.display = 'block';
      });
    }

    /* ---------- SALE 상품 렌더링 ---------- */
    const saleListEl  = document.getElementById('saleProductList');
    const saleEmptyEl = document.getElementById('saleEmptyBox');
    const saleCountEl = document.getElementById('saleCountText');
    const saleSortSel = document.getElementById('saleSortSelect');

    let saleProducts = loadDiscountProducts();

    function applySaleSort(list) {
      if (!saleSortSel) return list;
      const mode = saleSortSel.value;
      const copy = [...list];

      if (mode === 'latest') {
        copy.sort((a, b) => Number(b.id || 0) - Number(a.id || 0));
      } else if (mode === 'sales') {
        copy.sort((a, b) => (b.salesCount || 0) - (a.salesCount || 0));
      } else if (mode === 'priceLow') {
        copy.sort(
          (a, b) =>
            (normalizePrice(a.salePrice ?? a.discountPrice ?? a.price) || 0) -
            (normalizePrice(b.salePrice ?? b.discountPrice ?? b.price) || 0)
        );
      } else if (mode === 'priceHigh') {
        copy.sort(
          (a, b) =>
            (normalizePrice(b.salePrice ?? b.discountPrice ?? b.price) || 0) -
            (normalizePrice(a.salePrice ?? a.discountPrice ?? a.price) || 0)
        );
      }

      return copy;
    }

    function renderSaleProducts() {
      if (!saleListEl) return;

      if (!saleProducts.length) {
        saleListEl.innerHTML = '';
        if (saleEmptyEl) saleEmptyEl.style.display = 'flex';
        if (saleCountEl) saleCountEl.textContent = '0개의 상품';
        return;
      }

      const sorted = applySaleSort(saleProducts);

      if (saleEmptyEl) saleEmptyEl.style.display = 'none';
      if (saleCountEl) saleCountEl.textContent = `${sorted.length}개의 상품`;

      const html = sorted
        .map((p) => {
          const img1 = p.images && p.images.main1 ? p.images.main1 : '';
          const img2 = p.images && p.images.main2 ? p.images.main2 : '';
          const name = p.name || '';

          // 상세 페이지에서 사용할 id (원본상품 id와 같다고 가정)
          const baseId =
            p.originalProductId ||
            p.baseProductId ||
            p.productId ||
            p.id ||
            '';

          const originalRaw =
            p.originalPrice ?? p.price ?? p.basePrice ?? null;
          const saleRaw =
            p.salePrice ?? p.discountPrice ?? p.priceAfterDiscount ?? null;

          const originalText = formatPrice(originalRaw);
          const saleText = formatPrice(saleRaw);

          const onlyPriceRaw =
            originalRaw == null && saleRaw == null ? p.price : null;
          const onlyPriceText =
            originalRaw == null && saleRaw == null
              ? formatPrice(onlyPriceRaw)
              : '';

          return `
            <article class="product-card">
              <a href="#"
                 class="product-link"
                 data-product-id="${baseId}">
                <div class="product-thumb">
                  ${img1 ? `<img src="${img1}" alt="${name}">` : ''}
                  ${img2 ? `<img src="${img2}" alt="${name}" class="hover-img">` : ''}
                </div>
                <div class="product-info">
                  <h3 class="product-name">${name}</h3>
                  <p class="product-price">
                    ${
                      originalText && saleText
                        ? `<span style="text-decoration:line-through; color:#aaa; margin-right:6px;">
                             ${originalText}
                           </span>
                           <span style="font-weight:600;">${saleText}</span>`
                        : saleText
                        ? `<span style="font-weight:600;">${saleText}</span>`
                        : originalText
                        ? `<span style="font-weight:600;">${originalText}</span>`
                        : onlyPriceText
                        ? `<span style="font-weight:600;">${onlyPriceText}</span>`
                        : ''
                    }
                    ${
                      p.discountRate != null
                        ? `<span style="color:#ff3b3b; margin-left:4px;">${p.discountRate}%</span>`
                        : ''
                    }
                  </p>
                </div>
              </a>
            </article>
          `;
        })
        .join('');

      saleListEl.innerHTML = html;
    }

    if (saleSortSel) {
      saleSortSel.addEventListener('change', renderSaleProducts);
    }

    renderSaleProducts();

    /* ---------- 클릭 시 상품상세로 이동 ---------- */
    if (saleListEl) {
      saleListEl.addEventListener('click', function (e) {
        const link = e.target.closest('.product-link');
        if (!link) return;

        e.preventDefault();

        const productId = link.getAttribute('data-product-id');
        if (!productId) {
          alert('상품 상세 정보를 찾을 수 없습니다.');
          return;
        }

        // 그냥 상세 페이지로 보내고, 못 찾으면 product-detail 쪽에서 안내
        window.location.href =
          'product_detail.html?id=' + encodeURIComponent(productId);
      });
    }
  });
</script>





</body>
</html>
