<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FON - 하의</title>

  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont,
        sans-serif;
      background-color: #ffffff;
      color: #111;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ---------- 상단 네비게이션 ---------- */
    .gnb-wrapper {
      width: 100%;
      background-color: #000;
      color: #fff;
    }

    .gnb {
      max-width: 1200px;
      margin: 0 auto;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gnb-logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .gnb-menu {
      display: flex;
      gap: 30px;
      font-size: 14px;
    }

    .gnb-menu a {
      color: #fff;
      padding-bottom: 4px;
    }

    .gnb-menu a.sale {
      color: #ff3b3b;
      font-weight: 600;
    }

    /* 현재 페이지 표시용 흰색 밑줄 */
    .gnb-menu a.active {
      border-bottom: 2px solid #fff;
    }

    /* 우측 아이콘 영역 */
    .gnb-icons {
      display: flex;
      gap: 10px;
      align-items: center;
      color: #fff;
    }

    .icon-button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .icon-button svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 1.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-button:hover svg {
      opacity: 0.85;
    }

    /* ---------- 아우터 상단 영역 ---------- */
    .outer-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px 40px;
    }

    .outer-title {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .outer-sub {
      font-size: 14px;
      color: #555;
      margin-bottom: 40px;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 0;
    }

    /* 상단 정보 / 정렬 영역 */
    .outer-toolbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }

    .outer-count {
      color: #555;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
    }

    .select-sort {
      height: 34px;
      padding: 0 10px;
      border-radius: 3px;
      border: 1px solid #ddd;
      font-size: 13px;
      background-color: #fff;
    }

    /* 리스트 영역 */
    .outer-list-area {
      max-width: 1200px;
      margin: 0 auto;
      padding: 90px 20px 120px;
      text-align: center;
      font-size: 14px;
      color: #888;
    }

    .outer-list-area p.main {
      margin-bottom: 10px;
      font-size: 15px;
      color: #555;
    }

    .outer-list-area p.sub {
      font-size: 13px;
      color: #999;
    }

    /* ---------- FOOTER ---------- */
    .site-footer {
      background-color: #000;
      color: #fff;
      padding: 40px 0 20px;
      font-size: 14px;
    }

    .site-footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .footer-columns {
      display: flex;
      flex-wrap: wrap;
      gap: 60px;
      margin-bottom: 30px;
      justify-content: space-between;
    }

    .footer-col-title {
      font-weight: 600;
      margin-bottom: 14px;
    }

    .footer-col ul {
      list-style: none;
      padding: 0;
    }

    .footer-col li + li {
      margin-top: 6px;
    }

    .footer-col a {
      color: #ddd;
      font-size: 13px;
    }

    .footer-col a:hover {
      color: #fff;
    }

    .footer-desc {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
    }

    .footer-sns {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 18px;
    }

    .footer-bottom {
      border-top: 1px solid #333;
      padding-top: 15px;
      font-size: 12px;
      color: #aaa;
      text-align: left;
    }

    @media (max-width: 768px) {
      .gnb {
        padding: 0 16px;
      }

      .gnb-menu {
        display: none;
      }

      .outer-wrapper,
      .outer-toolbar,
      .outer-list-area {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- 상단 네비게이션 -->
  <header class="gnb-wrapper">
    <nav class="gnb">
      <div class="gnb-logo">
        <a href="main.html">FON</a>
      </div>

      <div class="gnb-menu">
        <a href="best.html">Best</a>
        <a href="sale.html" class="sale">SALE</a>
        <a href="outer.html">아우터</a>
        <a href="top.html">상의</a>
        <a href="bottom.html" class="active">하의</a>
        <a href="accessory.html">악세서리</a>
        <a href="community.html">커뮤니티</a>
        <a href="#">코디하기</a>
      </div>

      <!-- 우측 아이콘 -->
      <div class="gnb-icons">
        <!-- 검색 -->
        <button class="icon-button" aria-label="검색">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="6.3"></circle>
            <line x1="15.4" y1="15.4" x2="20" y2="20"></line>
          </svg>
        </button>

        <!-- 로그인 / 마이페이지 -->
        <a href="login.html" class="icon-button" aria-label="로그인 / 마이페이지">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="9" r="3.1"></circle>
            <path d="M6.5 19c.8-2.6 2.8-4.3 5.5-4.3s4.7 1.7 5.5 4.3"></path>
          </svg>
        </a>

        <!-- 장바구니 -->
        <button class="icon-button" aria-label="장바구니">
          <svg viewBox="0 0 24 24">
            <rect x="6.5" y="8" width="11" height="10" rx="1.8" ry="1.8"></rect>
            <path d="M9 8V6.7A2.2 2.2 0 0 1 12 4.5A2.2 2.2 0 0 1 15 6.7V8"></path>
            <path d="M9.3 12.2c.6.8 1.5 1.3 2.7 1.3s2.1-.5 2.7-1.3"></path>
          </svg>
        </button>

        <!-- 관리자 전용 + -->
        <button
          class="icon-button admin-add"
          aria-label="관리자 대시보드"
          style="display: none"
          onclick="window.location.href='admin.html'"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="7.5"></circle>
            <line x1="12" y1="9" x2="12" y2="15"></line>
            <line x1="9" y1="12" x2="15" y2="12"></line>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- 아우터 상단 설명 -->
  <section class="outer-wrapper">
    <h1 class="outer-title">하의</h1>
    <p class="outer-sub">
     편안하고 스타일리시한 하의 컬렉션
    </p>
  </section>

  <hr class="divider" />

  <!-- 상단 카운트 / 정렬 -->
  <div class="outer-toolbar">
    <div class="outer-count">총 0개</div>
    <div class="toolbar-right">
      <select class="select-sort">
        <option>최신순</option>
        <option>판매 많은순</option>
        <option>낮은 가격순</option>
        <option>높은 가격순</option>
      </select>
    </div>
  </div>

  <!-- 리스트 영역 (비어 있을 때 안내 문구) -->
  <section class="outer-list-area">
    <p class="main">등록된 하의 상품이 없습니다.</p>
    <p class="sub">관리자 페이지에서 상품을 등록하고 판매를 시작해보세요!</p>
  </section>

  <!-- 공통 푸터 -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="footer-columns">
        <div class="footer-col">
          <div class="footer-col-title">FON</div>
          <div class="footer-desc">
            트렌디한 패션을 제안하는<br />
            온라인 셀렉트샵
          </div>
        </div>

        <div class="footer-col">
          <div class="footer-col-title">고객센터</div>
          <ul>
            <li><a href="#">공지사항</a></li>
            <li><a href="#">자주묻는질문</a></li>
            <li><a href="#">1:1 문의</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <div class="footer-col-title">정보</div>
          <ul>
            <li><a href="#">회사 소개</a></li>
            <li><a href="#">이용약관</a></li>
            <li><a href="#">개인정보처리방침</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <div class="footer-col-title">소셜 미디어</div>
          <div class="footer-sns">
            <a href="#">📷</a>
            <a href="#">📘</a>
            <a href="#">▶️</a>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        © 2024 FON. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- 관리자 플러스 아이콘 표시 -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (localStorage.getItem('isAdmin') === 'true') {
        document
          .querySelectorAll('.admin-add')
          .forEach((el) => (el.style.display = 'flex'));
      }
    });
  </script>
</body>
</html>
